type User{
    id:ID!,
    name:String!,
    email:String!
}

type Post{
    id:ID!,
    title:String!,
    content:String!,
    author:User
}

type Comment{
    id:ID!,
    content:String!,
    post:Post,
    author:User
}

type Error {
    message:String!,
    Code:Int!
}

type Todo {
    userId: ID!,
    id: ID!,
    title: String!,
    completed: Boolean!
}

union UserResult = User | Error
