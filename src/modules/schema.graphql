type Query{
    messages: [Message!]!
    user:[User!]
    getUser(id:ID!):User
    getPost(id:ID!):Post!
    posts:[Post!]!
    comments:[Comment!]!
    getComment(id:ID):Comment!
    Users:[user]
    getUserID(id:ID):user
    Post:[Posts!]!
}

type Mutation{
    postMessage(content:String!,author:String!):Message!
}