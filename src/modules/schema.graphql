type Query{
    messages: [Message!]!
    user:[User!]!
    getUserBlog(id:ID!):UserResult
    getPostBlog(id:ID!):Post!
    posts:[Post!]!
    comments:[Comment!]!
    getCommentBlog(id:ID):Comment!
    Users:[user]
    getUserID(id:ID):user
    Post:[Posts!]!
    getUser(id:ID!):User
    getTodo(page:Int!,limit:Int!):[Todo!]!
    fetchHistory(name:String!):historyResult!
}

type Mutation{
    postMessage(content:String!,author:String!,title:String!):Message!
    updateUser(id:ID!,name:String!,email:String!):[User!]!
    deleteComments(id:ID!):[Comment!]!
    addPost(id:ID!,title:String!,content:String!,authorId:ID!):[Post!]!
    addComment(id:ID!,content:String!,authorId:ID!,postId:ID!):[Comment!]!
    postChat(message:String!):ChatResult!
    register(id:ID!,name:String!,email:String!):RegisterResult!
    login(name:String!):RegisterResult!
    setUserOnline(name:String!):String!
    setUserOffline(name:String!):String!
}

type Subscription{
    MessageAdded: Message
    PostChat: ChatResult
}